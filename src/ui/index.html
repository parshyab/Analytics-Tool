<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMI Analytics</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        color: #1f1f1f;
      }

      * {
        box-sizing: border-box;
      }

      .boot-fallback {
        padding: 32px;
        font-size: 14px;
        color: #333;
        min-height: 100%;
      }

      .boot-card {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }

      .boot-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #6c5ce7;
      }

      .boot-subtitle {
        color: #777;
      }

      .error-screen {
        padding: 24px;
        background: #fff5f5;
        color: #b00020;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-card">
          <div class="boot-title">LUMI Analytics</div>
          <div class="boot-subtitle">Loading productivity dashboard…</div>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div class="error-screen"><strong>LUMI UI Error</strong>\n\n' +
          (event.message || "Unknown error") +
          "\n\n" +
          (event.filename || "") +
          ":" +
          (event.lineno || "") +
          ":" +
          (event.colno || "") +
          "</div>";
      });

      window.addEventListener("unhandledrejection", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        var reason = event.reason;
        root.innerHTML =
          '<div class="error-screen"><strong>LUMI Promise Error</strong>\n\n' +
          (reason && reason.stack ? reason.stack : String(reason)) +
          "</div>";
      });
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
